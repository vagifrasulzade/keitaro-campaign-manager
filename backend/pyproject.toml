[project]
name = "adrobot-keitaro"
version = "1.0.0"
description = "Keitaro campaign creator & stream offer editor (FastAPI + SQLAlchemy)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
